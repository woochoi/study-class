services:
  db:
    image: postgres:17
    env_file: .env
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
      - ./db/create-test-db.sql:/docker-entrypoint-initdb.d/20-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studycafe"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
